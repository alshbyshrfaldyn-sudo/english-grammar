<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المهندس شرف الدين الشعبي - لوحة التحكم الشخصية</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --accent-glow: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
        }

        .profile-container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.1);
            text-align: center;
            position: relative;
        }

        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-glow);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 2.3rem;
            margin: 10px 0 15px 0;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .ornament {
            font-size: 1.3rem;
            color: #38bdf8;
            margin: 5px 0;
            letter-spacing: 5px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .skill-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .skill-card:hover {
            border-color: var(--accent-glow);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.2);
            color: var(--accent-glow);
        }

        /* شريط التنقل الخاص بربط الصفحات */
        .navigation-hub {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-link-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }

        .nav-link-btn:hover {
            background: linear-gradient(135deg, #0369a1, #1d4ed8);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.5);
        }

        .nav-link-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-link-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #0f172a;
            color: #38bdf8;
            text-align: center;
            border-radius: 8px;
            padding: 12px 20px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 1rem;
            border: 1px solid var(--accent-glow);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.3s, fadeout 0.3s 2.5s;
        }

        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }

        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>
<body>

    <div id="toast"></div>

    <div class="profile-container">
        <div class="badge">✦ إشراف المطور والباحث ✦</div>
        
        <div class="ornament">༺ ❀ ༻</div>
        <h1>المهندس شرف الدين الشعبي</h1>
        <div class="ornament">༺ ❀ ༻</div>

        <p class="subtitle">طالب ذكاء اصطناعي ومطور أنظمة برمجية متكاملة | جامعة الرازي</p>

        <div class="skills-grid">
            <div class="skill-card" onclick="speakPhrase('Artificial Intelligence', 'الذكاء الاصطناعي ورؤية الحاسوب')">🤖 ذكاء اصطناعي</div>
            <div class="skill-card" onclick="speakPhrase('Python Data Science', 'علوم البيانات وبايثون')">🐍 بايثون وتحليل بيانات</div>
            <div class="skill-card" onclick="speakPhrase('Full Stack Development', 'تطوير الويب وقواعد البيانات')">💻 ويب (PHP & MySQL)</div>
            <div class="skill-card" onclick="speakPhrase('Nabati Poetry', 'شعر نبطي أصيل')">✍️ شعر نبطي</div>
        </div>

        <!-- روابط التنقل السريع لربطها بملفات القواعد -->
        <div class="navigation-hub">
            <a href="Part1.html" class="nav-link-btn">🚀 البدء بسلسلة القواعد (الجزء 1)</a>
            <a href="Part40.html" class="nav-link-btn secondary">📌 الجزء 40 (النهاية الأولى)</a>
            <a href="Part41.html" class="nav-link-btn secondary">🔥 الجزء 41 (المتقدم)</a>
        </div>
    </div>

    <script>
        function speakPhrase(en, ar) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                var msg = new SpeechSynthesisUtterance();
                msg.text = en;
                msg.lang = 'en-US';
                msg.rate = 0.85;
                window.speechSynthesis.speak(msg);
            }
            
            var toast = document.getElementById("toast");
            if (toast) {
                toast.innerText = ar;
                toast.className = "show";
                setTimeout(function() {
                    toast.className = toast.className.replace("show", "");
                }, 2500);
            }
        }
    </script>
</body>
</html>
